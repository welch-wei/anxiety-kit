<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; font-family:"PingFang SC","Hiragino Sans GB",sans-serif;
  background: radial-gradient(900px 1100px at 50% 30%, #10233f 0%, #0b1120 55%, #070b16 100%);
  color:#e5e7eb; position:relative; display:flex; flex-direction:column; align-items:center; }
.ring { position:absolute; border-radius:50%; border:1.5px solid rgba(56,189,248,.22); }
.emoji { font-size:130px; margin-top:170px; }
.title { margin-top:60px; font-size:64px; font-weight:700; color:#7dd3fc; letter-spacing:6px; }
.big { margin-top:36px; font-size:150px; font-weight:900; color:#f8fafc; text-align:center; line-height:1.25;
  text-shadow:0 0 60px rgba(56,189,248,.3); white-space:pre-line; }
.sub { margin-top:50px; font-size:40px; color:#bae6fd; letter-spacing:2px; }
.tag { position:absolute; bottom:150px; font-size:36px; color:#64748b; }
.brand { position:absolute; bottom:70px; font-size:30px; color:#38bdf8; letter-spacing:4px; font-weight:700; }
</style></head><body>
<div class="ring" style="width:1000px;height:1000px;top:-300px;left:40px;"></div>
<div class="ring" style="width:700px;height:700px;top:-150px;left:190px;"></div>
<div class="emoji">🌙</div>
<div class="title">睡前脑子停不下来</div>
<div class="big">10分钟
睡前仪式</div>
<div class="sub">手机放远 · 慢呼吸 · 身体扫描 · 写下担忧</div>
<div class="tag">不是失眠，是焦虑在夜晚加重</div>
<div class="brand">焦虑急救箱 · 免费工具</div>
</body></html>
